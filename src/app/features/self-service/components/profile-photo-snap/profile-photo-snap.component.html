<nz-steps [nzCurrent]="current">
  <nz-step nzTitle="Instructions" nzIcon="unordered-list"></nz-step>
  <nz-step nzTitle="Take Picture" nzIcon="camera"></nz-step>
  <nz-step nzTitle="Submit" nzIcon="check-circle"></nz-step>
</nz-steps>

<div class="steps-content">
  @if (current == 0) {
    <div class="_instruction-window_wzfb4_1">
      <div class="_container_wzfb4_55">
        <div class="_text_wzfb4_15">
          <div class="_title_wzfb4_28">Selfie time!</div>
          <div class="_subtitle_wzfb4_43">Get ready</div>
        </div>
        <div class="_icon-container_wzfb4_111">
          <div class="_icon-block_wzfb4_88">
            <div class="_icon_wzfb4_88 _illumination_wzfb4_132"></div>
            Good illumination.
          </div>
          <div class="_icon-block_wzfb4_88">
            <div class="_icon_wzfb4_88 _no-accessories_wzfb4_136"></div>
            No accessories: glasses, mask, hat, etc.
          </div>
          <div class="_icon-block_wzfb4_88">
            <div class="_icon_wzfb4_88 _camera-on-eye_wzfb4_140"></div>
            Camera at eye level.
          </div>
        </div>
      </div>
    </div>
  }
  @if (current == 1) {
    <div *ngIf="loading" class="loader-container">
      <div class="loader">Preparing the camera</div>
    </div>

    <div class="video-wrapper">
      <video
        #webcam
        id="webcam"
        [hidden]="loading"
        autoplay
        class="pulse"
      ></video>
    </div>

    <!-- <div class="loader mt-3" *ngIf="!loading">{{ displayText }}</div> -->
    <!-- <div class="mt-3 d-flex justify-content-center" *ngIf="captureImageButton">
      <afc-button
      [label]="'Capture Image'"
      [disableButton]="false"
      [loading]="false"
      (buttonClick)="takeImage()"
      [style]="'primary'"
      [size]="'sm'"
    />
    </div> -->
    <div class="mt-3 d-flex justify-content-center">
      <afc-button
      [label]="'Capture Image'"
      [disableButton]="false"
      [loading]="false"
      (buttonClick)="takeImage()"
      [style]="'primary'"
      [size]="'sm'"
    />
    </div>
    <div class="mt-3">
      <!-- <nz-progress [nzPercent]="(captureTime / 2) * 100"></nz-progress> -->
    </div>
    
  }
  @if (current == 2) {
    <!-- Display Captured Image -->
    <div *ngIf="captureImage" class="captured-image-container">
      <h5>Captured Image:</h5>
      <img
        [src]="captureImage"
        style="max-width: -webkit-fill-available; border-radius: 20px"
        alt="Captured Snapshot"
        class="captured-image"
      />
    </div>
  }
</div>
<div class="steps-action d-flex justify-content-center">
  @if (current == 0) {
    <afc-button
      [label]="'Next'"
      [disableButton]="false"
      [loading]="false"
      (buttonClick)="next()"
      [style]="'primary'"
      [size]="'sm'"
    />
  }
  @if (current === 2) {
    <afc-button
      [label]="'Done'"
      [disableButton]="false"
      [loading]="false"
      (buttonClick)="done()"
      [style]="'primary'"
      [size]="'sm'"
    />
  }
</div>
