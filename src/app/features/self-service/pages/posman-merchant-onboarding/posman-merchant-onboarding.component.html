<section class="min-vh-100 gradient-custom d-flex align-items-center">
  <div class="container py-3">
    <div class="row justify-content-center align-items-center h-100">
      <div class="col-12 col-xl-10">
        <div class="card shadow-2-strong " style="border-radius: 15px;">
          <div class="card-body p-4">
            <img src="images/logo.png"
                 alt="POS Logo"
                 class="rounded-circle position-absolute top-0 end-0 m-4"
                 style="width: 70px; height: 70px; object-fit: contain;">
            <h3 class="mb-4">POS MACHINE REQUEST</h3>
            <form (ngSubmit)="onSubmit()")>

              <div class="row">
                <div class="col-md-6 mb-3">

                  <div data-mdb-input-init class="form-outline">
                    <input type="text" id="firstName" class="form-control form-control-sm"
                           [(ngModel)] = "pos().firstName" name = "firstName" />
                    <label class="form-label" for="firstName">First Name</label>
                  </div>

                </div>
                <div class="col-md-6 mb-3">

                  <div data-mdb-input-init class="form-outline">
                    <input type="text" id="lastName" class="form-control form-control-sm"
                           [(ngModel)] = "pos().lastName" name = "lastName"/>
                    <label class="form-label" for="lastName">Last Name</label>
                  </div>

                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">

                  <div data-mdb-input-init class="form-outline">
                    <input type="text" class="form-control form-control-sm" id="emailId"
                           [(ngModel)] = "pos().emailId" name = "emailId"/>
                    <label for="emailId" class="form-label">Email</label>
                  </div>

                </div>

                <div class="col-md-6 mb-3">

                  <div data-mdb-input-init class="form-outline">
                    <input type="text" class="form-control form-control-sm" id="accountNumber"
                           [(ngModel)] = "pos().accountNumber" name = "accountNumber"/>
                    <label for="emailId" class="form-label">Account Number</label>
                  </div>
                </div>

                <!--                  <h6 class="mb-2 pb-1">Gender: </h6>-->

                <!--                  <div class="form-check form-check-inline">-->
                <!--                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="femaleGender"-->
                <!--                           value="option1" checked />-->
                <!--                    <label class="form-check-label" for="femaleGender">Female</label>-->
                <!--                  </div>-->

                <!--                  <div class="form-check form-check-inline">-->
                <!--                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="maleGender"-->
                <!--                           value="option2" />-->
                <!--                    <label class="form-check-label" for="maleGender">Male</label>-->
                <!--                  </div>-->

                <!--                  <div class="form-check form-check-inline">-->
                <!--                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="otherGender"-->
                <!--                           value="option3" />-->
                <!--                    <label class="form-check-label" for="otherGender">Other</label>-->
                <!--                  </div>-->

              </div>


              <div class="row">
                <div class="col-md-6 mb-3">

                  <div data-mdb-input-init class="form-outline">
                    <!--                    <input type="email" id="branch" class="form-control form-control-lg"-->
                    <!--                           [(ngModel)] = "pos().branch" name = "branch"/>-->
                    <!--                    <label class="form-label" for="branch">Branch</label>-->

                    <label class="form-label" for="branch">Branch</label>
                  </div>

                </div>
                <div class="col-md-6 mb-3">

                  <div data-mdb-input-init class="form-outline">
                    <input type="tel" id="phone" class="form-control form-control-sm"
                           [(ngModel)] = "pos().phone" name = "phone"/>
                    <label class="form-label" for="phone">Phone Number</label>
                  </div>

                </div>
              </div>

              <div class="row">

                <div class="col-md-6 mb-3">

                  <div data-mdb-input-init class="form-outline">
                    <input type="file" id="shopLicense" class="form-control form-control-sm" name="shopLicense"
                           (change)="onFileSelected($event)" accept=".pdf,.jpg,.jpeg,.png"/>
                    <label class="form-label" for="shopLicense">Upload Shop License (PDF/Image)</label>
                  </div>

                </div>

                <div class="col-md-6 mb-3">
                  <button class="btn btn-success" type="submit">submit
                  </button>
                </div>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
